<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#F8FAFC" rx="0" ry="0" />

  <!-- Title -->
  <text x="600" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B" text-anchor="middle">Static Portfolio Web Architecture</text>
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Web App · Static Site · Simple Contact Form</text>

  <!-- Layer Labels -->
  <text x="30" y="160" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" font-weight="bold" transform="rotate(-90, 30, 160)">CLIENT</text>
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" font-weight="bold" transform="rotate(-90, 30, 340)">DELIVERY</text>
  <text x="30" y="530" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" font-weight="bold" transform="rotate(-90, 30, 530)">SERVICES</text>
  <text x="30" y="700" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8" font-weight="bold" transform="rotate(-90, 30, 700)">EXTERNAL</text>

  <!-- Lane dividers -->
  <line x1="60" y1="210" x2="1160" y2="210" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="60" y1="420" x2="1160" y2="420" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6,4" />
  <line x1="60" y1="620" x2="1160" y2="620" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="6,4" />

  <!-- ===== CLIENT LAYER ===== -->
  <!-- Web Browser -->
  <rect x="480" y="100" width="240" height="90" rx="8" ry="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
  <!-- Browser chrome decoration -->
  <rect x="480" y="100" width="240" height="22" rx="8" ry="0" fill="#3B82F6" />
  <rect x="480" y="114" width="240" height="8" fill="#3B82F6" />
  <circle cx="496" cy="111" r="4" fill="#93C5FD" />
  <circle cx="510" cy="111" r="4" fill="#93C5FD" />
  <circle cx="524" cy="111" r="4" fill="#93C5FD" />
  <rect x="540" y="106" width="140" height="10" rx="3" ry="3" fill="#BFDBFE" />
  <text x="600" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Web Browser</text>
  <text x="600" y="170" font-family="Arial, sans-serif" font-size="11" fill="#3B82F6" text-anchor="middle">Visitor's Browser</text>
  <text x="600" y="184" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Chrome · Firefox · Safari</text>

  <!-- ===== DELIVERY LAYER ===== -->
  <!-- CDN / Static Host -->
  <rect x="200" y="250" width="220" height="110" rx="8" ry="8" fill="#F0FDF4" stroke="#10B981" stroke-width="2" />
  <rect x="200" y="250" width="220" height="28" rx="8" ry="8" fill="#10B981" />
  <rect x="200" y="264" width="220" height="14" fill="#10B981" />
  <text x="310" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CDN / Static Host</text>
  <text x="310" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Static File Server</text>
  <text x="310" y="316" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">HTML · CSS · JS · Images</text>
  <text x="310" y="332" font-family="Arial, sans-serif" font-size="10" fill="#10B981" text-anchor="middle">Netlify / Vercel / GitHub Pages</text>
  <text x="310" y="350" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Global Edge Caching</text>

  <!-- Static Assets Box -->
  <rect x="500" y="250" width="200" height="110" rx="8" ry="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2" />
  <rect x="500" y="250" width="200" height="28" rx="8" ry="8" fill="#F59E0B" />
  <rect x="500" y="264" width="200" height="14" fill="#F59E0B" />
  <text x="600" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Static Assets</text>
  <text x="600" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">Portfolio Content</text>
  <text x="600" y="316" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Projects · About · Resume</text>
  <text x="600" y="334" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Images · Fonts · Icons</text>
  <text x="600" y="352" font-family="Arial, sans-serif" font-size="10" fill="#D97706" text-anchor="middle">Pre-built at deploy time</text>

  <!-- Contact Form Handler -->
  <rect x="780" y="250" width="220" height="110" rx="8" ry="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2" />
  <rect x="780" y="250" width="220" height="28" rx="8" ry="8" fill="#8B5CF6" />
  <rect x="780" y="264" width="220" height="14" fill="#8B5CF6" />
  <text x="890" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Form Handler</text>
  <text x="890" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4C1D95" text-anchor="middle">Contact Form</text>
  <text x="890" y="316" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Name · Email · Message</text>
  <text x="890" y="334" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Client-side Validation</text>
  <text x="890" y="352" font-family="Arial, sans-serif" font-size="10" fill="#8B5CF6" text-anchor="middle">Serverless / Form Service</text>

  <!-- ===== SERVICES LAYER ===== -->
  <!-- Build Pipeline -->
  <rect x="180" y="460" width="200" height="110" rx="8" ry="8" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2" />
  <rect x="180" y="460" width="200" height="28" rx="8" ry="8" fill="#0EA5E9" />
  <rect x="180" y="474" width="200" height="14" fill="#0EA5E9" />
  <text x="280" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Build Pipeline</text>
  <text x="280" y="508" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0C4A6E" text-anchor="middle">CI/CD Deploy</text>
  <text x="280" y="526" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Git Push → Auto Build</text>
  <text x="280" y="544" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Static Site Generator</text>
  <text x="280" y="562" font-family="Arial, sans-serif" font-size="10" fill="#0EA5E9" text-anchor="middle">Next.js / Astro / Hugo</text>

  <!-- Source Code Repo -->
  <rect x="430" y="460" width="200" height="110" rx="8" ry="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2" />
  <rect x="430" y="460" width="200" height="28" rx="8" ry="8" fill="#64748B" />
  <rect x="430" y="474" width="200" height="14" fill="#64748B" />
  <text x="530" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Source Code</text>
  <text x="530" y="508" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">Git Repository</text>
  <text x="530" y="526" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">HTML / CSS / JS</text>
  <text x="530" y="544" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Portfolio Source Files</text>
  <text x="530" y="562" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">GitHub / GitLab</text>

  <!-- Email Notification Service -->
  <rect x="680" y="460" width="200" height="110" rx="8" ry="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="2" />
  <rect x="680" y="460" width="200" height="28" rx="8" ry="8" fill="#F43F5E" />
  <rect x="680" y="474" width="200" height="14" fill="#F43F5E" />
  <text x="780" y="478" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Email Service</text>
  <text x="780" y="508" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#881337" text-anchor="middle">Notification Email</text>
  <text x="780" y="526" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Form Submission Alert</text>
  <text x="780" y="544" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Sent to Site Owner</text>
  <text x="780" y="562" font-family="Arial, sans-serif" font-size="10" fill="#F43F5E" text-anchor="middle">SendGrid / Formspree / Netlify</text>

  <!-- ===== EXTERNAL LAYER ===== -->
  <!-- Domain / DNS -->
  <rect x="200" y="660" width="180" height="90" rx="8" ry="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="290" y="695" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Domain / DNS</text>
  <text x="290" y="713" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Custom Domain</text>
  <text x="290" y="730" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">yourname.com</text>

  <!-- SSL / HTTPS -->
  <rect x="420" y="660" width="180" height="90" rx="8" ry="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="510" y="695" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">SSL / HTTPS</text>
  <text x="510" y="713" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">TLS Certificate</text>
  <text x="510" y="730" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Let's Encrypt / Auto SSL</text>

  <!-- Analytics -->
  <rect x="640" y="660" width="180" height="90" rx="8" ry="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="730" y="695" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Analytics</text>
  <text x="730" y="713" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Visitor Tracking</text>
  <text x="730" y="730" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Google Analytics / Plausible</text>

  <!-- Spam Protection -->
  <rect x="860" y="660" width="180" height="90" rx="8" ry="8" fill="#FAFAFA" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="950" y="695" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Spam Protection</text>
  <text x="950" y="713" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" text-anchor="middle">Bot Prevention</text>
  <text x="950" y="730" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">reCAPTCHA / Honeypot</text>

  <!-- ===== CONNECTIONS ===== -->

  <!-- Browser → CDN (request page) -->
  <line x1="530" y1="190" x2="380" y2="250" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="400" y="208" width="100" height="18" rx="3" ry="3" fill="#EFF6FF" />
  <text x="450" y="221" font-family="Arial, sans-serif" font-size="10" fill="#3B82F6" text-anchor="middle">Request Page</text>

  <!-- CDN → Browser (serve files) -->
  <line x1="370" y1="248" x2="520" y2="192" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="5,3" />
  <rect x="390" y="226" width="90" height="18" rx="3" ry="3" fill="#F0FDF4" />
  <text x="435" y="239" font-family="Arial, sans-serif" font-size="10" fill="#10B981" text-anchor="middle">Serve HTML/CSS</text>

  <!-- Browser → Contact Form -->
  <line x1="670" y1="155" x2="820" y2="250" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="700" y="188" width="90" height="18" rx="3" ry="3" fill="#F5F3FF" />
  <text x="745" y="201" font-family="Arial, sans-serif" font-size="10" fill="#8B5CF6" text-anchor="middle">Submit Form</text>

  <!-- CDN → Static Assets (serves from) -->
  <line x1="420" y1="305" x2="500" y2="305" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" />
  <text x="460" y="298" font-family="Arial, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">serves</text>

  <!-- Form Handler → Email Service -->
  <line x1="890" y1="360" x2="820" y2="460" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="820" y="395" width="80" height="18" rx="3" ry="3" fill="#FFF1F2" />
  <text x="860" y="408" font-family="Arial, sans-serif" font-size="10" fill="#F43F5E" text-anchor="middle">Send Alert</text>

  <!-- Source Code → Build Pipeline -->
  <line x1="430" y1="515" x2="380" y2="515" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow)" />
  <text x="405" y="508" font-family="Arial, sans-serif" font-size="9" fill="#0EA5E9" text-anchor="middle">trigger</text>

  <!-- Build Pipeline → CDN (deploy) -->
  <line x1="280" y1="460" x2="290" y2="360" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3" />
  <rect x="245" y="400" width="80" height="18" rx="3" ry="3" fill="#F0F9FF" />
  <text x="285" y="413" font-family="Arial, sans-serif" font-size="10" fill="#0EA5E9" text-anchor="middle">Deploy Files</text>

  <!-- Domain → CDN -->
  <line x1="290" y1="660" x2="290" y2="570" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" />
  <text x="305" y="618" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">DNS</text>

  <!-- SSL → CDN -->
  <line x1="480" y1="660" x2="380" y2="570" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" />

  <!-- Analytics → Browser (tracks) -->
  <line x1="730" y1="660" x2="650" y2="192" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" />
  <text x="720" y="430" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">track</text>

  <!-- Spam Protection → Form Handler -->
  <line x1="920" y1="660" x2="910" y2="570" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3" />
  <text x="935" y="618" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">protect</text>

  <!-- Legend -->
  <rect x="70" y="740" width="1060" height="44" rx="6" ry="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
  <line x1="100" y1="762" x2="130" y2="762" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="140" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">HTTP Request</text>
  <line x1="240" y1="762" x2="270" y2="762" stroke="#10B981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)" />
  <text x="280" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">File Response</text>
  <line x1="390" y1="762" x2="420" y2="762" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)" />
  <text x="430" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">CI/CD Deploy</text>
  <line x1="540" y1="762" x2="570" y2="762" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow)" />
  <text x="580" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">Email Notification</text>
  <line x1="710" y1="762" x2="740" y2="762" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="750" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">External Service</text>
  <circle cx="870" cy="762" r="5" fill="#10B981" />
  <text x="882" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">No Database Required</text>
  <circle cx="1020" cy="762" r="5" fill="#F59E0B" />
  <text x="1032" y="766" font-family="Arial, sans-serif" font-size="11" fill="#374151">No CMS</text>

</svg>