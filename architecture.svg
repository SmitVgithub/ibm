<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background -->
  <rect x="0" y="0" width="1200" height="800" fill="#F8FAFC"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle">TrackFleet - Real-Time Fleet Management System</text>
  <text x="600" y="55" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">500 Drivers | 50 Dispatchers | 10 Warehouses | Budget: &lt;$300/month</text>
  
  <!-- CLIENT LAYER -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">CLIENTS</text>
  
  <!-- Web Dashboard for Dispatchers -->
  <rect x="80" y="110" width="160" height="80" rx="8" ry="8" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Web Dashboard</text>
  <text x="160" y="158" font-family="Arial, sans-serif" font-size="10" fill="#DBEAFE" text-anchor="middle">Dispatchers (50)</text>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="9" fill="#BFDBFE" text-anchor="middle">React/Vue.js</text>
  
  <!-- Android Driver App -->
  <rect x="280" y="110" width="160" height="80" rx="8" ry="8" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <text x="360" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Android App</text>
  <text x="360" y="158" font-family="Arial, sans-serif" font-size="10" fill="#D1FAE5" text-anchor="middle">Drivers (500)</text>
  <text x="360" y="175" font-family="Arial, sans-serif" font-size="9" fill="#A7F3D0" text-anchor="middle">Offline GPS Tracking</text>
  
  <!-- iOS iPad App -->
  <rect x="480" y="110" width="160" height="80" rx="8" ry="8" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2"/>
  <text x="560" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">iPad App (iOS)</text>
  <text x="560" y="158" font-family="Arial, sans-serif" font-size="10" fill="#EDE9FE" text-anchor="middle">Warehouse Mgrs (10)</text>
  <text x="560" y="175" font-family="Arial, sans-serif" font-size="9" fill="#DDD6FE" text-anchor="middle">Inventory Dashboard</text>
  
  <!-- API GATEWAY LAYER -->
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">API GATEWAY</text>
  
  <!-- API Gateway -->
  <rect x="230" y="250" width="260" height="60" rx="8" ry="8" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <text x="360" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">API Gateway / Load Balancer</text>
  <text x="360" y="295" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">AWS API Gateway / Nginx</text>
  
  <!-- BACKEND SERVICES LAYER -->
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">BACKEND SERVICES</text>
  
  <!-- Fleet Service -->
  <rect x="50" y="370" width="140" height="70" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="120" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Fleet Service</text>
  <text x="120" y="412" font-family="Arial, sans-serif" font-size="9" fill="#E0F2FE" text-anchor="middle">Vehicle Tracking</text>
  <text x="120" y="427" font-family="Arial, sans-serif" font-size="9" fill="#BAE6FD" text-anchor="middle">Route Management</text>
  
  <!-- GPS Service -->
  <rect x="210" y="370" width="140" height="70" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="280" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">GPS Service</text>
  <text x="280" y="412" font-family="Arial, sans-serif" font-size="9" fill="#E0F2FE" text-anchor="middle">Real-time Location</text>
  <text x="280" y="427" font-family="Arial, sans-serif" font-size="9" fill="#BAE6FD" text-anchor="middle">Offline Sync</text>
  
  <!-- Notification Service -->
  <rect x="370" y="370" width="140" height="70" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="440" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Notification Svc</text>
  <text x="440" y="412" font-family="Arial, sans-serif" font-size="9" fill="#E0F2FE" text-anchor="middle">Alerts &amp; Updates</text>
  <text x="440" y="427" font-family="Arial, sans-serif" font-size="9" fill="#BAE6FD" text-anchor="middle">Push/SMS</text>
  
  <!-- Billing Service -->
  <rect x="530" y="370" width="140" height="70" rx="8" ry="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="2"/>
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Billing Service</text>
  <text x="600" y="412" font-family="Arial, sans-serif" font-size="9" fill="#E0F2FE" text-anchor="middle">Invoice Generation</text>
  <text x="600" y="427" font-family="Arial, sans-serif" font-size="9" fill="#BAE6FD" text-anchor="middle">Payment Processing</text>
  
  <!-- EXTERNAL INTEGRATIONS -->
  <text x="760" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">EXTERNAL SERVICES</text>
  
  <!-- Twilio -->
  <rect x="750" y="110" width="140" height="60" rx="8" ry="8" fill="#E11D48" stroke="#BE123C" stroke-width="2"/>
  <text x="820" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Twilio</text>
  <text x="820" y="155" font-family="Arial, sans-serif" font-size="10" fill="#FECDD3" text-anchor="middle">SMS Alerts</text>
  
  <!-- Mapbox -->
  <rect x="910" y="110" width="140" height="60" rx="8" ry="8" fill="#0891B2" stroke="#0E7490" stroke-width="2"/>
  <text x="980" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Mapbox</text>
  <text x="980" y="155" font-family="Arial, sans-serif" font-size="10" fill="#CFFAFE" text-anchor="middle">Live Maps</text>
  
  <!-- Stripe -->
  <rect x="830" y="190" width="140" height="60" rx="8" ry="8" fill="#6366F1" stroke="#4F46E5" stroke-width="2"/>
  <text x="900" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Stripe</text>
  <text x="900" y="235" font-family="Arial, sans-serif" font-size="10" fill="#E0E7FF" text-anchor="middle">Invoice Payments</text>
  
  <!-- DATA LAYER -->
  <text x="60" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">DATA LAYER</text>
  
  <!-- PostgreSQL -->
  <rect x="100" y="510" width="150" height="70" rx="8" ry="8" fill="#1E40AF" stroke="#1E3A8A" stroke-width="2"/>
  <text x="175" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">PostgreSQL</text>
  <text x="175" y="555" font-family="Arial, sans-serif" font-size="9" fill="#DBEAFE" text-anchor="middle">Fleet, Users, Routes</text>
  <text x="175" y="570" font-family="Arial, sans-serif" font-size="9" fill="#BFDBFE" text-anchor="middle">AWS RDS</text>
  
  <!-- Redis -->
  <rect x="280" y="510" width="150" height="70" rx="8" ry="8" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
  <text x="355" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Redis</text>
  <text x="355" y="555" font-family="Arial, sans-serif" font-size="9" fill="#FEE2E2" text-anchor="middle">GPS Cache</text>
  <text x="355" y="570" font-family="Arial, sans-serif" font-size="9" fill="#FECACA" text-anchor="middle">Real-time Data</text>
  
  <!-- TimescaleDB -->
  <rect x="460" y="510" width="150" height="70" rx="8" ry="8" fill="#7C3AED" stroke="#6D28D9" stroke-width="2"/>
  <text x="535" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">TimescaleDB</text>
  <text x="535" y="555" font-family="Arial, sans-serif" font-size="9" fill="#EDE9FE" text-anchor="middle">GPS History</text>
  <text x="535" y="570" font-family="Arial, sans-serif" font-size="9" fill="#DDD6FE" text-anchor="middle">Time-series Data</text>
  
  <!-- INFRASTRUCTURE -->
  <text x="760" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">INFRASTRUCTURE</text>
  
  <!-- AWS Cloud -->
  <rect x="750" y="335" width="200" height="130" rx="8" ry="8" fill="#FF9900" stroke="#E68A00" stroke-width="2"/>
  <text x="850" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">AWS Cloud</text>
  <text x="850" y="385" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">ECS / Fargate</text>
  <text x="850" y="405" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">CloudWatch</text>
  <text x="850" y="425" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">S3 Storage</text>
  <text x="850" y="445" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">ElastiCache</text>
  
  <!-- WebSocket Server -->
  <rect x="750" y="480" width="200" height="55" rx="8" ry="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="850" y="505" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">WebSocket Server</text>
  <text x="850" y="522" font-family="Arial, sans-serif" font-size="9" fill="#D1FAE5" text-anchor="middle">Real-time Updates</text>
  
  <!-- CONNECTION LINES -->
  <!-- Clients to API Gateway -->
  <line x1="160" y1="190" x2="280" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="190" x2="360" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="190" x2="440" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- API Gateway to Services -->
  <line x1="280" y1="310" x2="120" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="310" x2="280" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="310" x2="440" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="310" x2="600" y2="370" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Services to Databases -->
  <line x1="120" y1="440" x2="175" y2="510" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="440" x2="355" y2="510" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="440" x2="535" y2="510" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="440" x2="175" y2="510" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  
  <!-- Services to External -->
  <line x1="440" y1="370" x2="750" y2="140" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="370" x2="910" y2="140" stroke="#0891B2" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="370" x2="830" y2="220" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  
  <!-- Services to AWS -->
  <line x1="600" y1="405" x2="750" y2="400" stroke="#FF9900" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- WebSocket connections -->
  <line x1="360" y1="190" x2="750" y2="507" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  
  <!-- LEGEND -->
  <rect x="980" y="560" width="200" height="120" rx="8" ry="8" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="1080" y="580" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Legend</text>
  
  <line x1="995" y1="595" x2="1030" y2="595" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="1040" y="599" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">API Request</text>
  
  <line x1="995" y1="615" x2="1030" y2="615" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="1040" y="619" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">External API</text>
  
  <line x1="995" y1="635" x2="1030" y2="635" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="1040" y="639" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">WebSocket</text>
  
  <rect x="995" y="650" width="15" height="10" fill="#3B82F6"/>
  <text x="1020" y="659" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Client Apps</text>
  
  <rect x="995" y="668" width="15" height="10" fill="#0EA5E9"/>
  <text x="1020" y="677" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">Backend Services</text>
  
  <!-- Budget Note -->
  <rect x="50" y="620" width="280" height="80" rx="8" ry="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="190" y="645" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle">Estimated Monthly Cost</text>
  <text x="70" y="665" font-family="Arial, sans-serif" font-size="9" fill="#065F46">• AWS (ECS, RDS, ElastiCache): ~$180</text>
  <text x="70" y="680" font-family="Arial, sans-serif" font-size="9" fill="#065F46">• Twilio SMS: ~$50 | Mapbox: ~$50</text>
  <text x="70" y="695" font-family="Arial, sans-serif" font-size="9" fill="#065F46">• Stripe: Pay-per-transaction | Total: &lt;$300</text>
  
  <!-- Scale Note -->
  <rect x="350" y="620" width="280" height="80" rx="8" ry="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="490" y="645" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">System Capacity</text>
  <text x="370" y="665" font-family="Arial, sans-serif" font-size="9" fill="#1E40AF">• 500 concurrent driver connections</text>
  <text x="370" y="680" font-family="Arial, sans-serif" font-size="9" fill="#1E40AF">• GPS updates every 10 seconds</text>
  <text x="370" y="695" font-family="Arial, sans-serif" font-size="9" fill="#1E40AF">• Offline sync up to 24 hours</text>
  
  <!-- Tech Stack Note -->
  <rect x="650" y="620" width="280" height="80" rx="8" ry="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="790" y="645" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">Technology Stack</text>
  <text x="670" y="665" font-family="Arial, sans-serif" font-size="9" fill="#92400E">• Backend: Node.js / Python FastAPI</text>
  <text x="670" y="680" font-family="Arial, sans-serif" font-size="9" fill="#92400E">• Android: Kotlin | iOS: Swift</text>
  <text x="670" y="695" font-family="Arial, sans-serif" font-size="9" fill="#92400E">• Web: React + TypeScript</text>
</svg>