name: Deploy Shreeji IT Website

on:
  push:
    branches: [master, shreeji-company-website]
  pull_request:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm test || true

      - name: Build Docker image
        run: docker build -t shreeji-it-website:latest .

      - name: Verify build
        run: |
          docker run -d -p 3000:3000 --name test-container shreeji-it-website:latest
          sleep 5
          curl -f http://localhost:3000 || exit 1
          docker stop test-container
          docker rm test-container
          echo "Build verified successfully!"