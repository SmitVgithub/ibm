name: Deploy Pizza App

on:
  push:
    branches: [feature/pizza-order-app, master]
    paths:
      - 'pizza-app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pizza-app/package.json
      - name: Install dependencies
        working-directory: pizza-app
        run: npm install
      - name: Verify server starts
        working-directory: pizza-app
        run: |
          node server.js &
          sleep 3
          curl -f http://localhost:3000/api/menu || exit 1
          kill %1

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: pizza-app
        run: docker build -t pizza-app:${{ github.sha }} .
      - name: Test Docker image
        run: |
          docker run -d -p 3000:3000 --name pizza-test pizza-app:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3000/api/menu
          docker stop pizza-test
